<!DOCTYPE html>
<html>
<head>
  <title>Create Account • DesertCart</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages.css" />
</head>
<body>

  <div class="navbar">
    <div class="nav-inner">
      <div class="brand">Desert<span>Cart</span></div>
      <div class="nav-actions">
        <a href="login.html" class="secondary">Login</a>
      </div>
    </div>
  </div>

  <form class="form" onsubmit="registerUser(event)">
    <h2>Create your account</h2>
    <div class="field">
      <input id="reg-name" type="text" placeholder="Name" required />
    </div>
    <div class="field">
      <input id="reg-email" type="email" placeholder="Email" required />
    </div>
    <div class="field">
      <input id="reg-password" type="password" placeholder="Password" required />
    </div>
    <button type="submit">Create Account</button>
  </form>

  <script src="../js/auth.js"></script>
</body>
</html>
